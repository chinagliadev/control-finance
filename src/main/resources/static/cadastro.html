<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <main class="login-main">

        <section class="login-image-side d-none d-md-flex">
            <div class="login-image-overlay">
                 <img class="img-login" src="./assets/img/img-login.jpg" alt="">
            </div>
        </section>

        <section class="login-form-side">

            <div class="login-form-content">
                <h3 class="display-6 fw-bold m-0">Cadastrar</h3>
                <small class="text-muted">Faça cadastro para se cadastrar-se no sistema</small>

                <form class="needs-validation mt-4" novalidate id="formulario_cadastro">

                    <div class="mb-3">
                        <label for="txtNomeCompleto" class="form-label">
                            Nome Completo
                        </label>

                        <input type="text" class="form-control form-control-sm" id="txtNomeCompleto" autocomplete="off"
                            placeholder="Nome Sobrenome" required minlength="3">

                        <div class="invalid-feedback">
                            Informe seu nome completo.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="txtEmail" class="form-label">
                            Email
                        </label>

                        <input type="email" class="form-control form-control-sm" id="txtEmail" autocomplete="off"
                            placeholder="exemplo@gmail.com" required>

                        <div class="invalid-feedback">
                            Informe um email válido.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="txtSenha" class="form-label">
                            Senha
                        </label>

                        <input type="password" class="form-control form-control-sm" id="txtSenha" autocomplete="new-password"
                            placeholder="**************" required minlength="6">

                        <div class="invalid-feedback">
                            A senha deve possuir pelo menos 6 caracteres.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="txtCPF" class="form-label">
                            CPF
                        </label>

                        <input type="text" class="form-control form-control-sm" id="txtCPF" autocomplete="off"
                            placeholder="123.456.789-00" required minlength="11" maxlength="14">

                        <div class="invalid-feedback">
                            Informe seu CPF.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark btn-sm w-100">
                        Cadastro
                    </button>

                </form>

                <a href="index.html" class="d-block text-decoration-none mt-3 text-center text-dark">
                    Já possui cadastro? Faça login aqui
                </a>
            </div>

        </section>

    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"
        integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
